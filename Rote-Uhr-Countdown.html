<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><title>Rote Uhr – Countdown</title><style>body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#fafafa;color:#20242b}main{max-width:540px;margin:auto;padding:24px 16px;text-align:center}h1{font-size:25px}.clock{width:min(85vw,390px);margin:20px auto;position:relative;aspect-ratio:1}svg{width:100%;height:100%}.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}.remaining{font-size:clamp(36px,10vw,58px);font-weight:750;font-variant-numeric:tabular-nums}.sub{color:#666}button,input{font:inherit}button{border:1px solid #ccc;border-radius:12px;padding:13px 18px;background:white;min-height:48px;cursor:pointer}button.primary{background:#ba222b;color:white;border-color:#ba222b}.buttons{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.settings{display:flex;justify-content:center;align-items:center;gap:12px;margin:18px 0}.settings input{width:75px;padding:10px;border-radius:10px;border:1px solid #aaa;font-size:22px;text-align:center}.help{color:#666;font-size:14px;line-height:1.5}#status{min-height:24px;font-weight:600}</style></head><body><main><h1>Meine rote Uhr</h1><div class="settings"><label for="minutes">Minuten einstellen</label><input id="minutes" type="number" min="1" max="60" step="1" value="5"></div><div class="clock"><svg viewBox="0 0 200 200" aria-label="Roter Kreis zeigt die verbleibende Zeit von 60 Minuten"><circle cx="100" cy="100" r="89" fill="#f1f1f1"/><path id="sector" fill="#df333e"/><circle cx="100" cy="100" r="89" fill="none" stroke="#ddd" stroke-width="2"/></svg><div class="center"><div id="remaining" class="remaining">05:00</div><div class="sub">noch übrig</div></div></div><div class="buttons"><button class="primary" id="start">▶ Start</button><button id="reset">↺ Zurücksetzen</button></div><p id="status" aria-live="polite"></p><p class="help">Eine volle rote Uhr bedeutet 60 Minuten. Pro Minute verschwindet 1/60 des Kreises – vom Ende des roten Bereichs zurück. Funktioniert offline; während der Nutzung das iPad-Display eingeschaltet lassen.</p></main><script>(()=>{const inp=document.querySelector('#minutes'),sector=document.querySelector('#sector'),remaining=document.querySelector('#remaining'),start=document.querySelector('#start'),reset=document.querySelector('#reset'),status=document.querySelector('#status');let duration=300000,left=duration,running=false,at=0,raf=0,audio=null;function clamp(){let n=Number(inp.value);if(!Number.isFinite(n))n=5;n=Math.max(1,Math.min(60,Math.round(n)));inp.value=n;return n}function draw(){let f=Math.max(0,Math.min(1,left/3600000));if(f>=1)sector.setAttribute('d','M100 11 A89 89 0 1 1 99.999 11 Z');else if(f<=0)sector.setAttribute('d','');else{let angle=-Math.PI/2+2*Math.PI*f;let x=100+89*Math.cos(angle),y=100+89*Math.sin(angle);sector.setAttribute('d',`M100 100 L100 11 A89 89 0 ${f>0.5?1:0} 1 ${x} ${y} Z`)}let sec=Math.ceil(left/1000);remaining.textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}function sync(){if(running){left=Math.max(0,left-(performance.now()-at));at=performance.now();if(left<=0){running=false;start.textContent='▶ Start';status.textContent='Fertig!';try{let ctx=audio||new (window.AudioContext||window.webkitAudioContext)();let osc=ctx.createOscillator(),gain=ctx.createGain();osc.connect(gain);gain.connect(ctx.destination);osc.frequency.value=660;gain.gain.value=.13;osc.start();osc.stop(ctx.currentTime+.35)}catch(e){}}}draw();if(running)raf=requestAnimationFrame(sync)}function stop(){if(running){left=Math.max(0,left-(performance.now()-at));running=false;cancelAnimationFrame(raf)}}function restart(){stop();duration=clamp()*60000;left=duration;status.textContent='';start.textContent='▶ Start';draw()}start.addEventListener('click',()=>{if(running){stop();start.textContent='▶ Weiter';draw();return}if(left<=0)restart();if(!audio){try{audio=new (window.AudioContext||window.webkitAudioContext)();audio.resume()}catch(e){}}running=true;at=performance.now();status.textContent='';start.textContent='⏸ Pause';raf=requestAnimationFrame(sync)});reset.addEventListener('click',restart);inp.addEventListener('change',restart);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&running){sync()}});restart()})();</script></body></html>
